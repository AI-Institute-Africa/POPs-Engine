# Dev stack: docker compose up --build   ->  console http://localhost:5173, API http://localhost:8000/docs
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    POPS_DATABASE_URL: postgresql+psycopg://pops:pops@postgres:5432/pops
    POPS_REDIS_URL: redis://redis:6379/0
    POPS_PIPELINE_MODE: celery
    POPS_STORAGE_BACKEND: s3
    POPS_S3_ENDPOINT_URL: http://minio:9000
    POPS_S3_ACCESS_KEY: pops
    POPS_S3_SECRET_KEY: pops-minio-secret
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    minio-init: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: pops, POSTGRES_PASSWORD: pops, POSTGRES_DB: pops }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pops"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: pops, MINIO_ROOT_PASSWORD: pops-minio-secret }
    volumes: [miniodata:/data]
    ports: ["9001:9001"]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 pops pops-minio-secret; do sleep 1; done;
             mc mb --ignore-existing local/pops-evidence && mc version enable local/pops-evidence"

  api:
    <<: *backend
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A app.workers.tasks:celery_app worker --loglevel=info --concurrency=2

  beat:
    <<: *backend
    command: celery -A app.workers.tasks:celery_app beat --loglevel=info

  console:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

  # Optional self-hosted reader: docker compose --profile local-vlm up, then
  # set POPS_OLLAMA_URL=http://ollama:11434 and pull a model (see docs/models.md).
  ollama:
    image: ollama/ollama:0.12.6
    profiles: [local-vlm]
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

volumes:
  pgdata:
  miniodata:
  ollama:

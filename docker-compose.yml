# Dev stack: docker compose up --build   ->  console http://localhost:5173, API http://localhost:8000/docs
# Evidence is stored on a shared volume here; in production set POPS_STORAGE_BACKEND=s3 with
# POPS_S3_ENDPOINT_URL / POPS_S3_BUCKET / keys for AWS S3, Cloudflare R2 or a self-hosted store.
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    POPS_DATABASE_URL: postgresql+psycopg://pops:pops@postgres:5432/pops
    POPS_REDIS_URL: redis://redis:6379/0
    POPS_PIPELINE_MODE: celery
    POPS_STORAGE_BACKEND: ${POPS_STORAGE_BACKEND-local}
    POPS_STORAGE_LOCAL_DIR: /data/evidence
    POPS_CLAMAV_HOST: ${POPS_CLAMAV_HOST-clamav}
  volumes: [evidence:/data/evidence]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: pops, POSTGRES_PASSWORD: pops, POSTGRES_DB: pops }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pops"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7

  # malware scanning for every upload; first start downloads signatures (a few minutes)
  clamav:
    image: clamav/clamav:1.4
    volumes: [clamdb:/var/lib/clamav]

  api:
    <<: *backend
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A app.workers.tasks:celery_app worker --loglevel=info --concurrency=2

  beat:
    <<: *backend
    command: celery -A app.workers.tasks:celery_app beat --loglevel=info

  console:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

  # Optional self-hosted reader: docker compose --profile local-vlm up, then
  # set POPS_OLLAMA_URL=http://ollama:11434 and pull a model (see docs/models.md).
  ollama:
    image: ollama/ollama:0.12.6
    profiles: [local-vlm]
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

volumes:
  clamdb:
  pgdata:
  evidence:
  ollama:
